# =================================================================
# N5 Game Platform — HTTPS Reverse Proxy Virtual Host Configuration
# =================================================================

upstream n5_backend {
    server app:8080;
    keepalive 32;
}

# -----------------------------------------------------------------
# HTTP (Port 80): Health Check & Redirect to HTTPS
# -----------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Lightweight internal health endpoint
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Redirect all other HTTP traffic to HTTPS (301 Permanent Redirect)
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------
# HTTPS (Port 443): SSL Termination, Security Headers & Reverse Proxy
# -----------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # TLS Certificates (Mount external Let's Encrypt or private certs to /etc/nginx/ssl/)
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body Size Limits (Allows reasonable image uploads / KYC verification)
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # WebSocket Upgrade Headers (Real-time Crash game / game streaming support)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Timeout Settings
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Proxy Pass all traffic to N5 backend application
    location / {
        proxy_pass http://n5_backend;
    }

    # Static Assets Caching Optimization
    location /public/ {
        proxy_pass http://n5_backend;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }
}
