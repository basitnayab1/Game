# =================================================================
# n5gamez.com hosts
#   n5gamez.com        landing page (+ APK download at /download/android)
#   www.n5gamez.com    redirects to n5gamez.com
#   admin.n5gamez.com  admin panel
#   api.n5gamez.com    player app API
# HTTP on port 80 is redirected to HTTPS by the catch-all server in default.conf.
# =================================================================

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name n5gamez.com;
    include /etc/nginx/conf.d/n5-proxy.inc;
    include /etc/nginx/conf.d/n5-admin-block.inc;

    location / {
        proxy_pass http://n5_backend;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.n5gamez.com;
    include /etc/nginx/conf.d/n5-proxy.inc;

    return 301 https://n5gamez.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.n5gamez.com;
    include /etc/nginx/conf.d/n5-proxy.inc;

    # Admin pages must not be indexed or framed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Extra password before the admin login page (browser sign-in box).
    # The file is created on the server only; it is never in git.
    auth_basic "N5 Admin";
    auth_basic_user_file /etc/nginx/ssl/admin.htpasswd;

    location = / {
        return 302 /admin;
    }
    # The API uses the Authorization header for its own login token (plus
    # admin 2FA), which a browser password box would clash with.
    location /api/ {
        auth_basic off;
        proxy_pass http://n5_backend;
    }
    location / {
        proxy_pass http://n5_backend;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.n5gamez.com;
    include /etc/nginx/conf.d/n5-proxy.inc;
    include /etc/nginx/conf.d/n5-admin-block.inc;

    location = / {
        return 302 https://n5gamez.com/;
    }
    location / {
        proxy_pass http://n5_backend;
    }
}
