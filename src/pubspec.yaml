name: n5_game
publish_to: 'none'
# versionCode (+N) must go up on every release: the in-app updater compares it.
version: 1.0.5+10
description: N5 Game player application foundation and integration staging.
environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  dio: ^5.7.0
  url_launcher: ^6.3.1
  ota_update: ^6.0.0
  package_info_plus: 8.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/n5_crown_emblem.png
