plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing key, from the N5_ANDROID_* entries in the project's .env
// (or the same environment variables, e.g. on a build server). .env is not in
// git; every release must be signed with this key or installed apps cannot update.
def envFile = rootProject.file("../../.env")
def dotenv = [:]
if (envFile.exists()) {
    envFile.eachLine("UTF-8") { line ->
        def t = line.trim()
        def i = t.indexOf("=")
        if (t && !t.startsWith("#") && i > 0) dotenv[t.substring(0, i)] = t.substring(i + 1)
    }
}
def signingValue = { String key -> System.getenv(key) ?: dotenv[key] }
def keystoreBase64 = signingValue("N5_ANDROID_KEYSTORE_BASE64")
def releaseKeystore = keystoreBase64 ? new File(buildDir, "signing/n5-release.jks") : null
if (releaseKeystore) {
    releaseKeystore.parentFile.mkdirs()
    releaseKeystore.bytes = keystoreBase64.decodeBase64()
}

android {
    namespace = "com.n5.game"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    defaultConfig {
        applicationId = "com.n5.game"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile = releaseKeystore
                storePassword = signingValue("N5_ANDROID_KEYSTORE_PASSWORD")
                keyAlias = signingValue("N5_ANDROID_KEY_ALIAS")
                keyPassword = signingValue("N5_ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

// Refuse a release build without the key rather than fall back to the debug key:
// a debug-signed release would not install over the published app.
gradle.taskGraph.whenReady { graph ->
    if (!releaseKeystore && graph.allTasks.any { it.name.contains("Release") }) {
        throw new GradleException("Missing N5_ANDROID_KEYSTORE_BASE64 in .env: release builds must use the N5 release key.")
    }
}

flutter { source = "../.." }
